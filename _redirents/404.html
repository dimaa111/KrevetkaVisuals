<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена — KrevetkaVisuals</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            font-family: 'Inter', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-aura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 40%, rgba(255, 59, 111, 0.2), rgba(0, 0, 0, 0.96) 80%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
        }
        .code { font-size: 8rem; font-weight: 800; color: #ff3b6f; text-shadow: 0 0 30px rgba(255,59,111,0.3); }
        .title { font-size: 2rem; margin: 1rem 0; }
        .text { color: #aaa; margin-bottom: 2rem; }
        .btn {
            background: linear-gradient(95deg, #ff2d5a, #ff5a8a);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { transform: scale(1.03); box-shadow: 0 5px 15px rgba(255, 59, 111, 0.4); }
    </style>
    <script>
        // Сохраняем путь для восстановления после редиректа на главную
        var originalPath = window.location.pathname;
        // Перенаправляем на index.html с параметром ?p=
        var redirectUrl = '/' + '?p=' + encodeURIComponent(originalPath);
        window.location.replace(redirectUrl);
    </script>
</head>
<body>
<div class="bg-aura"></div>
<div class="container">
    <div class="code">404</div>
    <div class="title"><i class="fas fa-compass"></i> Страница не найдена</div>
    <div class="text">Перенаправление на главную...</div>
    <a href="/" class="btn">🏠 На главную</a>
</div>
</body>
</html>
